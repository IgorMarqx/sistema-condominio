name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  build:
    name: Build production images
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: read
      packages: write

    env:
      REGISTRY: ghcr.io

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Prepare image names
        id: images
        run: |
          image_namespace="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "app_image=${image_namespace}/app" >> "$GITHUB_OUTPUT"
          echo "nginx_image=${image_namespace}/nginx" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.GHCR_USERNAME }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Build and push app image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: app
          push: true
          tags: |
            ${{ steps.images.outputs.app_image }}:${{ github.sha }}
            ${{ steps.images.outputs.app_image }}:latest
          cache-from: type=gha,scope=app
          cache-to: type=gha,scope=app,mode=max

      - name: Build and push nginx image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: nginx
          push: true
          tags: |
            ${{ steps.images.outputs.nginx_image }}:${{ github.sha }}
            ${{ steps.images.outputs.nginx_image }}:latest
          cache-from: type=gha,scope=nginx
          cache-to: type=gha,scope=nginx,mode=max

  deploy:
    name: Deploy production
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 30

    steps:
      - name: Prepare image names
        id: images
        run: |
          image_namespace="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "app_image=${image_namespace}/app:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          echo "nginx_image=${image_namespace}/nginx:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          script_stop: true
          script: |
            set -euo pipefail

            echo "==> Preparando variáveis do deploy"
            DEPLOY_PATH="${{ secrets.DEPLOY_PATH }}"
            DEPLOY_PATH="${DEPLOY_PATH/#\~/$HOME}"
            APP_IMAGE="${{ steps.images.outputs.app_image }}"
            NGINX_IMAGE="${{ steps.images.outputs.nginx_image }}"

            echo "==> Entrando no diretório do projeto: $DEPLOY_PATH"
            cd "$DEPLOY_PATH"

            echo "==> Atualizando código do repositório"
            git fetch --prune origin
            git reset --hard "origin/${{ secrets.DEPLOY_BRANCH || 'main' }}"

            if [ -n "${{ secrets.GHCR_USERNAME }}" ] && [ -n "${{ secrets.GHCR_TOKEN }}" ]; then
              echo "==> Fazendo login no GHCR"
              echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u "${{ secrets.GHCR_USERNAME }}" --password-stdin
            else
              echo "==> Pulando login no GHCR: secrets GHCR_USERNAME/GHCR_TOKEN não configurados"
            fi

            export APP_IMAGE NGINX_IMAGE
            compose() { docker compose -f docker-compose.prod.yml "$@"; }

            echo "==> Baixando imagens Docker"
            echo "    APP_IMAGE=$APP_IMAGE"
            echo "    NGINX_IMAGE=$NGINX_IMAGE"
            compose pull app queue scheduler nginx

            echo "==> Subindo containers sem build local"
            compose up -d --no-build --remove-orphans app queue scheduler nginx

            echo "==> Rodando migrations"
            compose exec -T app php artisan migrate --force

            echo "==> Limpando e recriando caches do Laravel"
            compose exec -T app php artisan optimize:clear
            compose exec -T app php artisan optimize

            echo "==> Reiniciando workers"
            compose exec -T app php artisan queue:restart

            echo "==> Recarregando Nginx"
            compose exec -T nginx nginx -s reload

            echo "==> Deploy finalizado"
