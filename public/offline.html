<!doctype html>
<html lang="pt-BR">
    <head>
        <meta charset="utf-8" />
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1, viewport-fit=cover"
        />
        <meta name="theme-color" content="#13254f" />
        <title>Sem conexão · Condomínio</title>
        <style>
            html,
            body {
                margin: 0;
                height: 100%;
            }
            body {
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                gap: 12px;
                font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
                color: #fff;
                text-align: center;
                padding: 24px;
                background: linear-gradient(
                    160deg,
                    #1a3166 0%,
                    #13254f 55%,
                    #0b1734 100%
                );
            }
            img {
                width: 96px;
                height: 96px;
                border-radius: 50%;
            }
            h1 {
                font-size: 22px;
                margin: 8px 0 0;
            }
            p {
                margin: 0;
                opacity: 0.75;
                max-width: 280px;
                font-size: 14px;
                line-height: 1.5;
            }
            button {
                margin-top: 16px;
                border: 0;
                border-radius: 999px;
                padding: 14px 28px;
                font: inherit;
                font-weight: 700;
                background: #f5cf3c;
                color: #13254f;
            }
        </style>
    </head>
    <body>
        <img src="/icones/icone-192.png" alt="" />
        <h1>Sem conexão</h1>
        <p>
            As contas e o caixa precisam da internet para mostrar valores
            atualizados.
        </p>
        <button onclick="location.reload()">Tentar de novo</button>
    </body>
</html>
