# Ambiente de desenvolvimento: MySQL 8 e Redis.
# A aplicação roda na máquina (composer run dev). Em produção o banco é o RDS ou o MySQL do host.
services:
    mysql:
        image: mysql:8.4
        container_name: condominio-mysql
        restart: unless-stopped
        environment:
            MYSQL_ROOT_PASSWORD: root
            MYSQL_DATABASE: condominio
        ports:
            - '${FORWARD_DB_PORT:-3307}:3306'
        volumes:
            - condominio-mysql:/var/lib/mysql
            - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
        healthcheck:
            test: ['CMD', 'mysqladmin', 'ping', '-proot']
            interval: 5s
            retries: 20

volumes:
    condominio-mysql:
